[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vsss-robot-client"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["bleak", "pynput", "inputs"]

[project.scripts]
calibrate = "tools.calibrate:main"
vsss-manual = "vsss._ble_client:main"
vsss-telemetry = "tools.telemetry_listener:main"

[tool.setuptools]
packages = ["vsss", "tools"]
py-modules = ["car", "gps", "mecanum_client"]

[tool.setuptools.package-dir]
"" = "compat"
vsss = "vsss"
tools = "tools"
