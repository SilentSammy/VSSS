[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vsss-robot-client"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Pyro5>=5.17,<6", "bleak>=0.22", "pymunk>=7,<8", "inputs>=0.5", "pynput>=1.7"]

[project.optional-dependencies]
plot = ["numpy", "opencv-contrib-python>=4.8"]

[project.scripts]
vsss-observer = "vsss.cli:observe"
vsss-record = "vsss.cli:record"
vsss-playback = "vsss.playback:main"
vsss-bag = "vsss.playback:main"
vsss-live = "vsss.live:main"
vsss-sim = "vsss.simulation:main"
vsss-plot = "vsss.plot:main"
vsss-teleop = "vsss.teleop:main"
vsss-blockly = "python_blockly.server:main"

[tool.setuptools]
packages = ["vsss", "aruco_gps", "mp", "python_blockly"]

[tool.setuptools.package-dir]
vsss = "vsss"

[tool.setuptools.package-data]
aruco_gps = ["marker_config.json", "ball_thresholds.txt", "resources/board_*.png", "resources/sprites/*.png"]
python_blockly = ["*.html", "*.js", "*.css", "package*.json", "examples/*.py"]
