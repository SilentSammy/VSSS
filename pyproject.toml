[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vsss-robot-client"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["bleak", "pynput", "inputs"]

[project.optional-dependencies]
plot = ["numpy", "opencv-python"]

[project.scripts]
calibrate = "tools.calibrate:main"
vsss-teleop = "tools.vsss_teleop:main"
vsss-observer = "tools.vsss_observer:main"
vsss-plot = "tools.vsss_plot:main"
vsss-bag = "tools.vsss_bag:main"
vsss-live = "tools.vsss_live:main"

[tool.setuptools]
packages = ["vsss", "tools", "aruco_gps"]

[tool.setuptools.package-dir]
vsss = "vsss"
tools = "tools"
aruco_gps = "aruco_gps"
