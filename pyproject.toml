[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vsss-robot-client"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Pyro5>=5.17,<6", "bleak>=0.22"]

[project.optional-dependencies]
plot = ["numpy", "opencv-python"]

[project.scripts]
vsss-observer = "vsss.cli:observe"
vsss-record = "vsss.cli:record"
vsss-playback = "vsss.playback:main"
vsss-bag = "vsss.playback:main"
vsss-live = "vsss.live:main"
vsss-sim = "vsss.simulation:main"
vsss-plot = "vsss.desktop:plot"
vsss-teleop = "vsss.desktop:teleop"

[tool.setuptools]
packages = ["vsss"]

[tool.setuptools.package-dir]
vsss = "vsss"
